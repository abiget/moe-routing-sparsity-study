[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-routing-sparsity-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "abiget", email = "getachewante@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
    "transformers[torch]>=5.18.0",
]

[dependency-groups]
dev = [
    "isort>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
